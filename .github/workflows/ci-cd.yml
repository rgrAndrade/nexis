name: CI/CD Pipeline - Node.js to K8s

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- ESTÁGIO 1: Validação e Testes ---
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Instalar dependências
        run: |
          cd app/orders-api && npm ci
          cd ../payment-worker && npm ci

      - name: Executar Lint (Boa prática SRE/DevOps)
        run: |
          cd app/orders-api && npm run lint --if-present
          cd ../payment-worker && npm run lint --if-present

  # --- ESTÁGIO 2: Build e Push das Imagens Docker ---
  build-and-push:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        component: [orders-api, payment-worker]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (Permite cache avançado)
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: ./app/${{ matrix.component }}
          file: ./app/${{ matrix.component }}/Dockerfile
          push: true
          # Gera duas tags: uma com o hash do commit (rastreabilidade) e a 'latest'
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ github.sha }}
          # Utiliza cache do GitHub Actions para acelerar os próximos builds
          cache-from: type=gha
          cache-to: type=gha,mode=max