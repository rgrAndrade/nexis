apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  labels:
    app: orders-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
      - name: orders-api
        image: rgrsousa/orders-api:latest
        ports:
        - name: http           # <--- Nome da porta no container
          containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api-service
  namespace: default
  labels:                      # <--- Labels do Service
    app: orders-api
    release: kube-prometheus-stack
spec:
  type: NodePort
  selector:
    app: orders-api
  ports:
    - name: http               # <--- Nome exato da porta que o ServiceMonitor procura
      port: 3000
      targetPort: 3000
      nodePort: 30080